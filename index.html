        { id: "arts", title: "Arts & culture", notes: [
          "**The Proms**: an **eight-week summer** season of orchestral music, including at the **Royal Albert Hall**; organised by the **BBC since 1927**. The **Last Night of the Proms** is the best known.",
          "**Henry Purcell**: organist at **Westminster Abbey**; developed a distinct British style. **Handel**: German-born, British citizen in **1727**; *Water Music* (for George I), *Music for the Royal Fireworks* (George II), *Messiah* (often at Easter).",
          "**Gustav Holst**: *The Planets*; adapted 'Jupiter' into the hymn *I Vow to Thee My Country*. **Sir Edward Elgar**: born in **Worcester**; *Pomp and Circumstance* March No 1 (*Land of Hope and Glory*) is played at the Last Night of the Proms.",
          "**Ralph Vaughan Williams**: influenced by English **folk music**. **Sir William Walton**: coronation marches, film scores, *Façade*, *Belshazzar's Feast*. **Benjamin Britten**: operas *Peter Grimes* and *Billy Budd*; *A Young Person's Guide to the Orchestra* (based on Purcell); founded the **Aldeburgh** festival in **Suffolk**.",
          "Pop: **The Beatles**, **The Rolling Stones**, **Punk** (late 1970s), boy and girl bands (1990s). Venues: **Wembley**, **The O2** (Greenwich), **SECC** (Glasgow). Festivals: **Glastonbury**, **Isle of Wight**, **V Festival**.",
          "**National Eisteddfod of Wales**: annual festival of music, dance, art and performance largely in Welsh, with poetry competitions. **Mercury Music Prize** (each **September**, best album from UK and Ireland). **Brit Awards** (best British group, solo artist, etc.).",
          "**Theatre**: London's **West End** ('Theatreland'). **The Mousetrap** by **Agatha Christie** has run since **1952**, the longest initial run of any show. **Gilbert and Sullivan** comic operas: *HMS Pinafore*, *The Pirates of Penzance*, *The Mikado*. **Andrew Lloyd Webber** (with **Tim Rice** on some): *Jesus Christ Superstar*, *Evita*, *Cats*, *The Phantom of the Opera*.",
          "**Pantomime**: Christmas fairy-story shows with the **Dame** (a woman played by a man) and pantomime horse or cow. The **Edinburgh Festival** every summer; the biggest part is **the Fringe**. The **Laurence Olivier Awards** in London (named after the Shakespearean actor).",
          "**Art**: medieval art was mostly religious. **Hans Holbein** and **Sir Anthony Van Dyck** were foreign painters working here. Galleries: **National Gallery**, **Tate Britain**, **Tate Modern** (London), **National Museum** (Cardiff), **National Gallery of Scotland** (Edinburgh).",
          "**Turner Prize** (from **1984**): contemporary art; four shortlisted works shown at **Tate Britain**; winners include **Damien Hirst** and **Richard Wright**.",
          "**Artists**: **Thomas Gainsborough** (portraits in country scenery); **David Allan** (Scottish portraits; *The Origin of Painting*); **Joseph Turner** (landscapes in a modern style); **John Constable** (**Dedham Vale**, Suffolk–Essex border); **Pre-Raphaelites** (Holman Hunt, Dante Gabriel Rossetti, Sir John Millais; bright religious/literary scenes); **Sir John Lavery** (Northern Irish; painted the Royal Family); **Henry Moore** (large **bronze abstract** sculptures); **John Petts** (Welsh; engravings and **stained glass**); **Lucian Freud** (German-born; portraits); **David Hockney** (**pop art**, 1960s).",
          "**Architecture**: cathedrals at **Durham, Lincoln, Canterbury, Salisbury**; the **White Tower** (Norman keep); **Hardwick Hall** (Derbyshire). **Inigo Jones**: Queen's House, Greenwich; Banqueting House, Whitehall. **Sir Christopher Wren**: **St Paul's**. **Robert Adam** (Scottish): Dumfries House; influenced **Bath's Royal Crescent**. 19th-century Gothic revival: **Houses of Parliament**, **St Pancras Station**. **Sir Edwin Lutyens**: **New Delhi** and the **Cenotaph**. Modern: **Sir Norman Foster**, **Lord (Richard) Rogers**, **Dame Zaha Hadid**.",
          "**Gardens**: **'Capability' Brown** (natural-looking landscapes); **Gertrude Jekyll** (colourful gardens, often with Lutyens). **Chelsea Flower Show**.",
          "**Design**: **Thomas Chippendale** (furniture), **Clarice Cliff** (**Art Deco ceramics**), **Sir Terence Conran** (interiors). Fashion: **Mary Quant**, **Alexander McQueen**, **Vivienne Westwood**.",
          "**Literature**: Nobel winners **Sir William Golding**, **Seamus Heaney** (poet), **Harold Pinter** (playwright). **Agatha Christie**; **Ian Fleming** (James Bond). **The Lord of the Rings** (Tolkien) voted best-loved novel in **2003**. The **Man Booker Prize** (since **1968**): Ian McEwan, Hilary Mantel, Julian Barnes.",
          "**Authors**: **Jane Austen** (*Pride and Prejudice*, *Sense and Sensibility*; marriage and family). **Charles Dickens** (*Oliver Twist*, *Great Expectations*; **Scrooge** = mean, **Mr Micawber** = always hopeful). **Robert Louis Stevenson** (*Treasure Island*, *Kidnapped*, *Dr Jekyll and Mr Hyde*). **Thomas Hardy** (rural life; *Far from the Madding Crowd*, *Jude the Obscure*). **Sir Arthur Conan Doyle** (Scottish doctor; **Sherlock Holmes**). **Evelyn Waugh** (satire; *Decline and Fall*, *Scoop*, *Brideshead Revisited*). **Sir Kingsley Amis** (*Lucky Jim*). **Graham Greene** (*Brighton Rock*, *Our Man in Havana*). **J K Rowling** (Harry Potter).",
          "**Poetry**: *Beowulf* (Anglo-Saxon; hero fights monsters); *Sir Gawain and the Green Knight*; Shakespeare's **sonnets** (14 lines); **John Milton** (*Paradise Lost*); **Wordsworth** (nature); **Sir Walter Scott** (Scotland and the Borders; also novels); 19th century: **Blake, Keats, Byron, Shelley, Tennyson, Robert and Elizabeth Browning**; WWI: **Wilfred Owen**, **Siegfried Sassoon**; later: **de la Mare, Masefield, Betjeman, Ted Hughes**. Many are remembered in **Poets' Corner**, Westminster Abbey.",
          "**Recognise the poems**: 'Oh to be in England…' = **Browning**, *Home Thoughts from Abroad*; 'She walks in beauty…' = **Byron**; 'I wandered lonely as a cloud…daffodils' = **Wordsworth**; 'Tyger! Tyger! burning bright' = **Blake**; 'What passing-bells for these who die as cattle?' = **Wilfred Owen**, *Anthem for Doomed Youth*."
        ]},
        { id: "leisure", title: "Leisure & media", notes: [
          "**Gardening**: many rent an **allotment** for fruit and veg. Famous gardens: **Kew**, **Sissinghurst**, **Hidcote** (England); **Crathes Castle**, **Inveraray Castle** (Scotland); **Bodnant** (Wales); **Mount Stewart** (Northern Ireland).",
          "National flowers: England **rose**, Scotland **thistle**, Wales **daffodil**, Northern Ireland **shamrock**.",
          "Shops mostly open **seven days a week**, with shorter Sunday hours; many towns have weekly **markets**.",
          "**Traditional food**: England – **roast beef with Yorkshire puddings**, and **fish and chips**; Wales – **Welsh cakes** (flour, dried fruit, spices); Scotland – **haggis** (sheep's stomach stuffed with offal, suet, onions, oatmeal); Northern Ireland – **Ulster fry**.",
          "**Film**: first public shows in **1896**. **Charlie Chaplin** (silent tramp). 1930s directors **Sir Alexander Korda** and **Sir Alfred Hitchcock**. Wartime morale film *In Which We Serve*. **Sir David Lean**, **Ridley Scott**. Comedies: *Passport to Pimlico*, *The Ladykillers*, the *Carry On* films. **Ealing Studios** may be the oldest continuously working studio. **Nick Park**: four Oscars, three for **Wallace and Gromit**. **Harry Potter** and **James Bond** are the two highest-grossing franchises.",
          "Actors: Olivier, David Niven, Rex Harrison, Richard Burton; recent Oscar winners Colin Firth, Anthony Hopkins, Judi Dench, Kate Winslet, Tilda Swinton. **BAFTA** awards are the British Oscars.",
          "Films to know: *The 39 Steps* (Hitchcock), *Brief Encounter* and *Lawrence of Arabia* (Lean), *The Third Man*, *Chariots of Fire*, *Four Weddings and a Funeral*, *Touching the Void*.",
          "**Comedy**: medieval **jesters**; 18th-century political cartoons; ***Punch*** magazine (**1840s**); *Private Eye*; **music hall** stars like **Morecambe and Wise**; satire *That Was The Week That Was* (1960s), *Spitting Image* (80s–90s); ***Monty Python's Flying Circus* (1969)**; sitcoms; stand-up.",
          "**TV licence**: needed for any device used to watch TV; one per home (separate tenancies need separate licences). Fine **up to £1,000**. **Over-75s** could get it free and **blind people 50% off** (⚠️ the over-75 rule changed in 2020). The licence funds the **BBC**, a public broadcaster **independent of government**; other channels use ads and subscriptions.",
          "**Pubs**: must be **18** to buy alcohol; at **16** you can drink wine or beer **with a meal** in a hotel or restaurant if with someone over 18. Pubs usually open from **11am** (noon Sundays). Pub quizzes, **pool and darts**.",
          "**Gambling**: **18** for betting shops and casinos. **National Lottery**: ⚠️ minimum age rose from **16 to 18 in April 2021**.",
          "**Pets**: cruelty and neglect are illegal. Dogs in public must wear a **collar with the owner's name and address**; owners must clean up after them."
        ]},
        { id: "places", title: "Places of interest", notes: [
          "There are **15 national parks** in England, Wales and Scotland.",
          "The **National Trust** (England, Wales, NI) and **National Trust for Scotland** are charities preserving buildings, coast and countryside. Founded in **1895 by three volunteers**; now **61,000+** volunteers.",
          "**Big Ben**: nickname of the **great bell** of the clock at the Houses of Parliament (people call the clock that too). The clock is over 150 years old. The tower was named **Elizabeth Tower** for the **2012 Diamond Jubilee**.",
          "**The Eden Project** (**Cornwall**): giant greenhouse-like **biomes** with plants from around the world; also an environmental charity.",
          "**Edinburgh Castle**: dominates the city skyline; dates to the early Middle Ages; run by **Historic Scotland**.",
          "**The Giant's Causeway**: **north-east coast of Northern Ireland**; columns of volcanic lava formed about **50 million years ago**; lots of legends.",
          "**Loch Lomond and the Trossachs National Park**: **720 sq miles** in the west of Scotland. **Loch Lomond** is the **largest expanse of fresh water in mainland Britain**.",
          "**The London Eye**: on the **south bank of the Thames**; a **135 m (443 ft)** wheel built for the **millennium**; part of New Year celebrations.",
          "**Snowdonia**: **North Wales** national park, **838 sq miles**; its best-known landmark is **Snowdon**, the **highest mountain in Wales**.",
          "**The Tower of London**: first built by **William the Conqueror**; tours by **Yeoman Warders (Beefeaters)**; home of the **Crown Jewels**.",
          "**The Lake District**: **England's largest national park** (**885 sq miles**). Biggest lake **Windermere**. **Wastwater** was voted Britain's favourite view in **2007**."

    {
      id: "c5", n: 5, title: "Government & law", long: "The UK government, the law and your role",
      color: "#6b2c91", icon: "🏛️",
      topics: [
        { id: "democracy", title: "Democracy & constitution", notes: [
          "In the early 1800s only men over **21** who owned property could vote.",
          "The **Chartists** (1830s–40s) wanted six things: votes for every man; elections every year; equal regions; **secret ballots**; any man able to be an MP; **paid MPs**. Most were adopted by **1918**.",
          "Votes for women over **30** in **1918**; for men and women over **21** in **1928** (fully democratic from then); voting age cut to **18** in **1969**.",
          "A **constitution** is the set of principles by which a country is governed. The UK's is **unwritten** (not in one document), because the UK never had a revolution that created a totally new system.",
          "Constitutional institutions: **the monarchy**, **Parliament** (Commons and Lords), **the Prime Minister**, **the cabinet**, **the judiciary**, **the police**, **the civil service**, **local government**. Plus devolved governments.",
          "**Constitutional monarchy**: the monarch is **head of state** but doesn't rule. They invite the leader of the largest party (or a coalition) to be **PM**, meet the PM regularly and can **advise, warn and encourage**; policy is decided by the PM and cabinet.",
          "The monarch opens each new session of Parliament with a **speech** setting out the government's plans; Acts are made in the monarch's name. They receive ambassadors, host heads of state and make state visits. They provide **stability and continuity**.",
          "⚠️ The 2013 handbook was written under **Queen Elizabeth II** (reigned from **1952**; **Diamond Jubilee 2012**; married to Prince Philip). She died on **8 September 2022**. **King Charles III** is now monarch; heir **William, Prince of Wales**.",
          "**National anthem**: '**God Save the King**' (or Queen). New citizens **swear** (oath) or **affirm** loyalty to the monarch."
        ]},
        { id: "govt", title: "Parliament & government", notes: [
          "**Parliamentary democracy**: voters in each **constituency** elect an **MP** at a **General Election**. The party with most MPs forms the government; otherwise a **coalition**.",
          "The **House of Commons** is more important because it is **elected**. The PM and almost all cabinet are MPs. MPs **represent everyone in their constituency**, **help create laws**, **scrutinise the government** and **debate national issues**.",
          "The **House of Lords**: **peers** aren't elected. Before **1958**: hereditary peers, senior judges and Church of England bishops. Since **1958** the PM can nominate **life peers** (appointed by the monarch on the PM's advice). Since **1999** hereditary peers elect a few of themselves to attend.",
          "The Lords is more independent of government; it suggests amendments, checks laws and holds the government to account. The **Commons can overrule the Lords**, rarely.",
          "**The Speaker**: chairs Commons debates; **neutral**; still an MP with a constituency; chosen by MPs in a **secret ballot**; keeps order and represents Parliament on ceremonial occasions.",
          "**Elections**: General Election **at least every five years**; **by-election** when an MP dies or resigns; **first past the post** (candidate with most votes wins). MPs, MSPs and others hold local '**surgeries**'.",
          "**The Prime Minister**: leader of the governing party; appoints the cabinet. Home: **10 Downing Street**; country house: **Chequers**. Can be replaced by their MPs; usually resigns after losing an election.",
          "**The cabinet**: about **20** senior ministers, meeting weekly. **Chancellor of the Exchequer** = economy; **Home Secretary** = crime, policing, immigration; **Foreign Secretary** = foreign relations; Secretaries of State for education, health, defence…",
          "**The opposition**: the **second-largest party**. Its leader challenges the PM at **Prime Minister's Questions** (weekly) and appoints a **shadow cabinet**.",
          "**Parties**: anyone **18+** can stand as an MP. Main parties: **Conservative**, **Labour**, **Liberal Democrats**, plus Scottish, Welsh and NI parties. Non-party MPs are **independents**.",
          "**Pressure and lobby groups**, e.g. the **CBI** (business), **Greenpeace** (environment), **Liberty** (human rights).",
          "**Civil servants**: deliver policy and services; chosen on merit; **politically neutral**. Core values: **integrity, honesty, objectivity, impartiality**.",
          "**Local government**: elected councils ('local authorities'), funded by central government and local taxes. Many mayors are ceremonial. **London** has **33 local authorities** plus the **Greater London Authority** and **Mayor of London**. Council elections are usually in **May**.",
          "**Devolution** (since **1997**; bodies since **1999**). **Defence, foreign affairs, immigration, taxation and social security** stay with the UK government. Education and many services are devolved. Each has its own civil service.",
          "**Wales**: Welsh government and Assembly in **Cardiff**; **60 members**, elected every **four years** by proportional representation; Welsh or English; laws in **20 areas** (education, health, economic development, housing); since **2011** without UK Parliament agreement. ⚠️ Renamed the **Senedd** in 2020; it meets in the Senedd building in **Cardiff Bay**.",
          "**Scotland**: Parliament formed **1999**, in **Edinburgh** (**Holyrood**); **129 MSPs**, proportional representation; can legislate on everything not reserved, e.g. civil and criminal law, health, education, planning, some taxes.",

<script>
(function(){
"use strict";
const C = window.CONTENT, RAW = window.QUESTIONS;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
const DAY = 864e5;
const todayISO = () => iso(new Date());
function iso(d){ const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/DAY); }
function fmtDate(s,opt){ return parseISO(s).toLocaleDateString(undefined,opt||{weekday:"short",day:"numeric",month:"short"}); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }

// ---------- data model ----------
const TOPICS = {}, ORDER = [], CH = {};
C.chapters.forEach(ch => { CH[ch.id]=ch; ch.topics.forEach(t => { TOPICS[t.id] = Object.assign({ch:ch.id, color:ch.color, chn:ch.n}, t); ORDER.push(t.id); }); });
// ---------- your own material (uploaded on this device) ----------
const XKEY = "settled.extra.v1";
function loadExtra(){ try { const s = localStorage.getItem(XKEY); if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.sets)) return o; } } catch(e){} return {sets:[]}; }
function saveExtra(x){ try { localStorage.setItem(XKEY, JSON.stringify(x)); return true; } catch(e){ return false; } }
const EXTRA = loadExtra();
// keyword index for placing uploaded items in the right topic
const STOP = new Set("about above after again against also because been before being below between both could does doing during each from further have having here into itself just more most other over same should some such than that their them then there these they this those through under until very what when where which while whom will with would your yours year years people british britain united kingdom which".split(" "));
const words = s => (String(s).toLowerCase().match(/[a-z][a-z'-]{3,}/g)||[]).filter(w=>!STOP.has(w));
const TWORDS = {}, DF = {};
C.chapters.forEach(ch => ch.topics.forEach(t => { const set = new Set(words(t.title+" "+t.title+" "+t.notes.join(" "))); TWORDS[t.id]=set; set.forEach(w=>DF[w]=(DF[w]||0)+1); }));
function guessTopic(text, chId){
  let best=null, bs=0;
  C.chapters.forEach(ch => { if (chId && ch.id!==chId) return; ch.topics.forEach(t => { let sc=0; new Set(words(text)).forEach(w=>{ if (TWORDS[t.id].has(w)) sc += 1/DF[w]; }); if (sc>bs){bs=sc;best=t.id;} }); });
  return best || (chId ? CH[chId].topics[0].id : "values");
}
function resolveTopic(topic, chapter, text){
  const tl = String(topic||"").trim().toLowerCase();
  if (tl) {
    if (TOPICS[tl]) return tl;
    const exact = ORDER.find(id=>TOPICS[id].title.toLowerCase()===tl); if (exact) return exact;
    const part = ORDER.find(id=>TOPICS[id].title.toLowerCase().includes(tl) || tl.includes(TOPICS[id].title.toLowerCase())); if (part) return part;
  }
  const cs = String(chapter||"").trim().toLowerCase().replace(/^chapter\s*/,"");
  let chId = null;
  if (/^c?[1-5]$/.test(cs)) chId = "c"+cs.replace("c","");
  else if (cs) { const m = C.chapters.find(ch=>ch.title.toLowerCase().includes(cs)||ch.long.toLowerCase().includes(cs)); if (m) chId=m.id; }
  return guessTopic((topic||"")+" "+text, chId);
}
// added notes go at the end of their topic, marked so you can tell them apart
EXTRA.sets.forEach(set => (set.notes||[]).forEach(n => { const t = TOPICS[n.t]; if (t) t.notes.push("📎 "+n.text); }));
const XRAW = [];
EXTRA.sets.forEach(set => (set.qs||[]).forEach(r => { if (TOPICS[r[0]]) XRAW.push(r.concat([set.name])); }));
const USED = new Set();
// id = hash of the wording; if two questions share wording (e.g. "Which statement is correct?") add the first option
const qid = r => { let id = hash(r[1]); if (USED.has(id)) id = hash(r[1]+"|"+(typeof r[2]==="boolean"?r[2]:r[2][0])); USED.add(id); return id; };
const toQ = (r, src) => {
  if (typeof r[2] === "boolean") return {id:qid(r), t:r[0], q:r[1], opts:["True","False"], correct:[r[2]?0:1], tf:true, e:r[3]||"", src};
  return {id:qid(r), t:r[0], q:r[1], opts:r[2], correct:Array.from({length:r[3]},(_,i)=>i), tf:false, e:r[4]||"", src};
};
const QS = RAW.map(r => toQ(r, null));
const sig = r => r[1]+"|"+(typeof r[2]==="boolean"?r[2]:r[2].slice(0,r[3]).join("|"));
const SIGS = new Set(RAW.map(sig));
XRAW.forEach(r => { const rr = r.slice(0,-1); if (SIGS.has(sig(rr))) return; SIGS.add(sig(rr)); QS.push(toQ(rr, r[r.length-1])); });
const MINE = QS.length - RAW.length;
const QBY = {}; QS.forEach(q => QBY[q.id]=q);
const QBT = {}; QS.forEach(q => (QBT[q.t]=QBT[q.t]||[]).push(q));

// ---------- state ----------
const KEY = "settled.v1";
let mem = null;
function blank(){ return {v:1, start:todayISO(), testDate:addDays(todayISO(),27), read:{}, qs:{}, cards:{}, mocks:[], taskDone:{}, days:{}, newToday:{d:"",n:0}, xpLog:{}, badges:null, prefs:{theme:"auto", sound:false, haptics:true, name:""}}; }
function load(){ try { const s = localStorage.getItem(KEY); if (s) { const o = Object.assign(blank(), JSON.parse(s)); o.prefs = Object.assign(blank().prefs, o.prefs||{}); return o; } } catch(e){} return mem || blank(); }
let S = load();
function save(){ mem = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function markActive(){ S.days[todayISO()] = (S.days[todayISO()]||0) + 1; }
function streak(){ let n=0, d=todayISO(); if(!S.days[d]) d=addDays(d,-1); while(S.days[d]){ n++; d=addDays(d,-1);} return n; }

// ---------- stats ----------
function topicStats(t){
  const list = QBT[t]||[]; let seen=0, right=0, tries=0;
  list.forEach(q => { const s=S.qs[q.id]; if(s){ seen++; tries+=s.n; right+=s.c; } });
  return {total:list.length, seen, acc: tries? right/tries : null, coverage: list.length? seen/list.length : 0};
}
function recentAcc(n){
  const all = Object.values(S.qs).filter(s=>s.at).sort((a,b)=>b.at-a.at).slice(0,n||80);
  if (all.length < 8) return null;
  return all.reduce((a,s)=>a+(s.last?1:0),0)/all.length;
}
function readiness(){
  const acc = recentAcc(80); const lastMocks = S.mocks.slice(-3);
  const mockAvg = lastMocks.length ? lastMocks.reduce((a,m)=>a+m.score/m.total,0)/lastMocks.length : null;
  const cov = ORDER.reduce((a,t)=>a+topicStats(t).coverage,0)/ORDER.length;
  let est = null;
  if (mockAvg!=null && acc!=null) est = .6*mockAvg + .4*acc; else est = mockAvg ?? acc;
  if (est!=null) est = est * (0.75 + 0.25*Math.min(1, cov*1.6));
  return {est, cov, acc, mockAvg};
}
function weakTopics(n){
  return ORDER.map(t=>({t, s:topicStats(t)})).filter(x=>x.s.seen>=3).sort((a,b)=>a.s.acc-b.s.acc).slice(0,n||4);
}
function record(q, ok){
  const s = S.qs[q.id] || {n:0,c:0};
  s.n++; if(ok) s.c++; s.last = ok; s.at = Date.now(); S.qs[q.id]=s;
  if (!ok) { const c = S.cards[q.id] || {box:0}; c.box=0; c.due=todayISO(); S.cards[q.id]=c; }
  markActive();
}

// ---------- plan ----------
function buildPlan(){
  const start = S.start, test = S.testDate;
  let total = Math.max(5, Math.min(120, diffDays(start, test)));
  const weights = ORDER.map(t => TOPICS[t].notes.join(" ").length);
  const learnDays = Math.max(3, Math.min(26, Math.round(total * 0.62)));
  const days = [];
  const sum = weights.reduce((a,b)=>a+b,0);
  // assign topics to learning days by cumulative weight (keeping chapter order)
  const buckets = Array.from({length:learnDays},()=>[]);
  let acc = 0;
  ORDER.forEach((t,i) => { const mid = acc + weights[i]/2; let b = Math.min(learnDays-1, Math.floor(mid/sum*learnDays)); buckets[b].push(t); acc += weights[i]; });
  // fill any empty bucket by borrowing (merge into review day)
  let di = 0;
  buckets.forEach((b,i) => {
    const date = addDays(start, di);
    if (b.length) days.push({date, kind:"learn", topics:b, tasks: b.flatMap(t=>[{k:"read",t},{k:"quiz",t}]).concat([{k:"cards"}])});
    else days.push({date, kind:"review", topics:[], tasks:[{k:"cards"},{k:"weak"}]});
    di++;
  });
  const rest = total - learnDays;
  for (let i=0;i<rest;i++){
    const date = addDays(start, di++);
    const last = i===rest-1;
    if (last && rest>1) days.push({date, kind:"final", topics:[], tasks:[{k:"cards"},{k:"facts"}]});
    else if (i%2===0) days.push({date, kind:"mock", topics:[], tasks:[{k:"mock"},{k:"weak"},{k:"cards"}]});
    else days.push({date, kind:"drill", topics:[], tasks:[{k:"weak"},{k:"cards"},{k:"quick"}]});
  }
  return days;
}
function taskKey(day, task){ return day.date+":"+task.k+(task.t?":"+task.t:""); }
function taskDone(day, task){
  if (task.k==="read") return !!S.read[task.t];
  if (task.k==="quiz") return !!(S.taskDone["quiz:"+task.t]);
  return !!S.taskDone[taskKey(day,task)];
}
function dayDone(day){ return day.tasks.every(t=>taskDone(day,t)); }
const TASKLABEL = {
  read: t => ["Read: "+TOPICS[t].title, "Chapter "+TOPICS[t].chn+" notes"],
  quiz: t => ["Quiz: "+TOPICS[t].title, "Up to 10 questions"],
  cards: () => ["Flashcard review", "Cards due today"],
  weak: () => ["Weak spots drill", "15 questions you find hardest"],
  mock: () => ["Mock exam", "24 questions · 45 minutes"],
  quick: () => ["Quick 10", "Mixed questions from everything"],
  facts: () => ["Test-day checklist", "Booking, ID, what happens"]
};
function dayTitle(d){ if(!d.topics.length) return KINDLABEL[d.kind]; const n=d.topics.map(x=>TOPICS[x].title); return KINDLABEL[d.kind]+": "+(n.length>2? n.slice(0,2).join(", ")+" +"+(n.length-2)+" more" : n.join(" & ")); }
const KINDLABEL = {learn:"Study", review:"Review", mock:"Mock day", drill:"Drill", final:"Final review"};

// ======================================================================

// guilloche security pattern (generated once, used as a CSS background)
function guilloche(){
  const curves = [[100,23,62,"#e7c675",.55],[100,37,48,"#e7c675",.35],[88,17,40,"#9fb4ea",.35],[70,29,36,"#e7c675",.25]];
  let paths = "";
  curves.forEach(([R,r,d,col,op]) => {
    let s = ""; const steps = 720;
    for (let i=0;i<=steps;i++){ const t = i/steps*Math.PI*2*r/ gcd(R,r); const x=(R-r)*Math.cos(t)+d*Math.cos((R-r)/r*t), y=(R-r)*Math.sin(t)-d*Math.sin((R-r)/r*t); s += (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }
    paths += `<path d='${s}' fill='none' stroke='${col}' stroke-opacity='${op}' stroke-width='.7'/>`;
  });
  return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='-170 -170 340 340'>${paths}</svg>`)}")`;
}
function gcd(a,b){ return b ? gcd(b, a%b) : a; }

// haptics: vibration on Android; on iPhone/iPad Safari, toggling a hidden switch gives a light tap
const HAS_VIBE = typeof navigator !== "undefined" && "vibrate" in navigator;
function haptic(kind){
  if (!S.prefs.haptics) return;
  try {
    if (HAS_VIBE) { navigator.vibrate({tap:8, ok:[14,50,22], bad:[40,60,40], big:[25,60,25,60,90]}[kind]||10); return; }
    const l = document.getElementById("hapticLbl"); if (!l) return;
    l.click(); if (kind==="bad"||kind==="big") setTimeout(()=>l.click(), 120); if (kind==="big") setTimeout(()=>l.click(), 260);
  } catch(e){}
}
let actx = null;
function sound(kind){
  if (!S.prefs.sound) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = {ok:[[880,0],[1318.5,.09]], bad:[[196,0],[164.8,.1]], tap:[[660,0]], big:[[523.3,0],[659.3,.1],[784,.2],[1046.5,.3]]}[kind]||[[660,0]];
    notes.forEach(([f,at]) => { const o=actx.createOscillator(), g=actx.createGain(); o.type = kind==="bad"?"triangle":"sine"; o.frequency.value=f; const t=actx.currentTime+at; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+(kind==="big"?.5:.25)); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.6); });
  } catch(e){}
}
const REDUCED = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(power){
  if (REDUCED()) return;
  const c = document.createElement("canvas"); c.id="confetti"; document.body.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio||1), W = innerWidth, H = innerHeight;
  c.width=W*dpr; c.height=H*dpr; c.style.width=W+"px"; c.style.height=H+"px";
  const x = c.getContext("2d"); x.scale(dpr,dpr);
  const cols = ["#c8102e","#ffffff","#14213d","#e7c675","#2453b3","#f3d98f"];
  const n = Math.round(150*(power||1));
  const P = Array.from({length:n}, (_,i) => ({x: W/2 + (Math.random()-.5)*W*.3, y: H*.42, vx:(Math.random()-.5)*16, vy:-Math.random()*17-5, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.35, w:6+Math.random()*7, h:3+Math.random()*5, c:cols[i%cols.length], s:Math.random()<.25}));
  const t0 = performance.now();
  (function f(t){ const el=(t-t0)/1000; x.clearRect(0,0,W,H);
    P.forEach(p => { p.vy += .42; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1-el/2.8); x.fillStyle=p.c; if (p.s){ x.beginPath(); x.arc(0,0,p.w/2.4,0,7); x.fill(); } else x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+1); x.restore(); });
    if (el < 2.9) requestAnimationFrame(f); else c.remove(); })(t0);
}
function xpFloat(n, el){
  const r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : {left:innerWidth/2, top:innerHeight/2, width:0};
  const d = document.createElement("div"); d.className="xpfloat"; d.textContent = "+"+n+" XP";
  d.style.left = (r.left + r.width/2)+"px"; d.style.top = (r.top - 6)+"px";
  document.body.appendChild(d); setTimeout(()=>d.remove(), 1200);
}

// ======================================================================
// GAMIFICATION: XP and levels derived from your study history, plus a
// small per-day log for the daily goal. Old progress keeps all its XP.
// ======================================================================
const RANKS = ["Newcomer","Visitor","Explorer","Commuter","Local","Regular","Resident","Settled","Citizen-ready","National treasure"];
const GOAL = 100;
function xpTotal(){
  let xp = 0;
  Object.values(S.qs).forEach(s => { xp += s.n*2 + s.c*8; });
  xp += Object.keys(S.read).length*25;
  Object.values(S.cards).forEach(c => { xp += (c.box||0)*5; });
  S.mocks.forEach(m => { xp += m.score*5 + (m.score/m.total>=.75?100:0); });
  xp += Object.keys(S.days).length*20;
  return xp;
}
const lvlFloor = L => 60*L*(L-1);
function levelInfo(xp){
  const L = Math.max(1, Math.floor((1+Math.sqrt(1+xp/15))/2));
  const a = lvlFloor(L), b = lvlFloor(L+1);
  return {L, xp, into: xp-a, need: b-a, pct: (xp-a)/(b-a), rank: RANKS[Math.min(RANKS.length-1, Math.floor((L-1)/1.5))]};
}
function todayXP(){ const d = todayISO(); return (S.xpLog && S.xpLog[d]) || 0; }
function gain(n, el){
  if (!n) return; const d = todayISO(); S.xpLog = S.xpLog || {};
  const before = S.xpLog[d]||0; S.xpLog[d] = before + n;
  const keys = Object.keys(S.xpLog).sort(); if (keys.length > 60) delete S.xpLog[keys[0]];
  if (el !== false) xpFloat(n, el);
  if (before < GOAL && before + n >= GOAL) pending.push({kind:"goal"});
}

function stampSVG(b, locked, uid){

  const icon = b.ch ? `<g transform="translate(29 27) scale(.66)" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ILLUS[b.ch]}</g>`
    : `<g transform="translate(37 35) scale(1.1)" color="${col}" style="color:${col}">${I[b.ic].replace('<svg ','<svg width="24" height="24" ')}</g>`;

let pending = [];
function checkBadges(){
  S.badges = S.badges || {};
  const fresh = BADGES.filter(b => !S.badges[b.id] && b.test());
  fresh.forEach(b => S.badges[b.id] = todayISO());
  const lv = levelInfo(xpTotal()).L;
  if (S.lastLevel == null) S.lastLevel = lv;
  else if (lv > S.lastLevel) { pending.push({kind:"level", L:lv}); S.lastLevel = lv; }
  if (fresh.length) { pending.push({kind:"badges", list:fresh.map(b=>b.id)}); }
  if (fresh.length || pending.length) save();
}
function showPending(){
  if (!pending.length || $("#overlayHost").innerHTML || (route==="quiz" && session && !session.done)) return;
  const p = pending.shift();
  let inner;
  if (p.kind==="badges"){
    const list = p.list.map(id=>BADGES.find(b=>b.id===id));
    const b = list[0];
    inner = `<div class="big-stamp">${stampSVG(b,false,"ov")}</div>
      <p class="eyebrow" style="color:var(--gold)">${list.length>1?`${list.length} new stamps`:"New stamp"}</p>
      <h2>${esc(b.name)}${list.length>1?` <span class="muted" style="font-size:1rem">+${list.length-1} more</span>`:""}</h2>
      <p class="muted">${list.length>1?list.map(x=>esc(x.name)).join(", "):esc(b.desc)}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="closeov">Lovely</button><button class="btn" data-act="closeov" data-then="progress">See passport</button></div>`;
  } else if (p.kind==="level"){
    const li = levelInfo(xpTotal());
    inner = `<div class="big-stamp" style="display:grid;place-items:center"><div class="photo" style="width:130px;height:130px;border-radius:50%;background:var(--cover);border:3px solid var(--gold-hi)"><span class="display foil" style="font-size:4rem;font-weight:900">${p.L}</span></div></div>

    inner = `<div class="big-stamp" style="display:grid;place-items:center;color:var(--good)">${goalRing(1,"var(--good)",170)}</div>

      <p class="muted">That's how it sticks: a little every day.</p><button class="btn primary" data-act="closeov">Cheers</button>`;

  const btn = $("#overlayHost .btn"); if (btn) btn.focus();

function goalRing(p, col, size){
  const r=30, c=2*Math.PI*r;
  return `<svg viewBox="0 0 76 76" ${size?`width="${size}" height="${size}"`:""} aria-hidden="true" style="transform:rotate(-90deg)"><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c} ${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}" style="transition:stroke-dashoffset 1s var(--ease)"/></svg>`;
}
// chapter progress 0..1: reading counts 35%, practice coverage 65%
function chProg(ch){
  const ts = CH[ch].topics; let sum = 0;
  ts.forEach(t => { const s = topicStats(t.id); sum += (S.read[t.id]?.35:0) + .65*Math.min(1, s.seen/Math.max(1, s.total*.6)); });
  return sum/ts.length;
}

let afterFns = [];
function after(){
  const f=afterFns; afterFns=[]; f.forEach(fn=>fn());
  // fixed sheets live outside the animated view so they span the screen
  const sh = $("#view .sheet"), host = $("#sheetHost"); host.innerHTML = ""; if (sh) host.appendChild(sh);
  // count-up numbers
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, from = +(el.dataset.from||0); el.removeAttribute("data-count");
    if (REDUCED() || to===from) { el.textContent = to.toLocaleString(); return; }
    const t0 = performance.now(), dur = 900;
    (function f(t){ const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = Math.round(from+(to-from)*e).toLocaleString(); if (k<1) requestAnimationFrame(f); })(t0);
  });
  // bars that grow in
  requestAnimationFrame(()=>document.querySelectorAll("[data-w]").forEach(el=>{ el.style.width = el.dataset.w; el.removeAttribute("data-w"); }));
}

function gauge(p, label){
  // semicircle readiness gauge with pass-mark tick at 75%
  const R=56, cx=66, cy=66, a0=Math.PI, pt = f => [cx+R*Math.cos(a0+f*Math.PI), cy+R*Math.sin(a0+f*Math.PI)];
  const [x1,y1]=pt(0), [x2,y2]=pt(1), [px,py]=pt(Math.max(.001,Math.min(1,p||0))), [tx,ty]=pt(.75), [tx2,ty2]=[cx+(R+9)*Math.cos(a0+.75*Math.PI), cy+(R+9)*Math.sin(a0+.75*Math.PI)];
  const len = Math.PI*R;
  return `<svg class="gauge" viewBox="0 0 132 84" role="img" aria-label="Readiness ${label}">
    <path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="11" stroke-linecap="round"/>
    ${p!=null?`<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="url(#gg)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}" style="transition:stroke-dashoffset 1.2s var(--ease)" data-dash="${len*(1-Math.min(1,p))}"/>`:""}
    <line x1="${tx}" y1="${ty}" x2="${tx2}" y2="${ty2}" stroke="#f6efe0" stroke-width="2.5" stroke-linecap="round"/>
    <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#c8102e"/><stop offset=".6" stop-color="#e7c675"/><stop offset="1" stop-color="#58d69a"/></linearGradient></defs>
    <text x="66" y="62" text-anchor="middle" fill="#f6efe0" font-size="${p==null?15:26}" font-weight="800">${label}</text>
    <text x="66" y="80" text-anchor="middle" fill="rgba(246,239,224,.6)" font-size="8.5" font-weight="700" letter-spacing="1.4" font-family="Inter,sans-serif">READINESS</text>

}

  <svg class="map" viewBox="0 0 370 236" role="group" aria-label="Journey through the five chapters">
    <path d="${d}" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="var(--line2)" stroke-width="2" class="trail" stroke-linecap="round"/>

    <defs><linearGradient id="jg" x1="0" x2="1"><stop offset="0" stop-color="#c8102e"/><stop offset=".5" stop-color="#e7c675"/><stop offset="1" stop-color="#1d6b4c"/></linearGradient></defs>

    ${stations}

  </svg></section>`;
}

function runTask(d){
  const key = d.k==="quiz" ? "quiz:"+d.t : d.date+":"+d.k+(d.t?":"+d.t:"");

  if (d.k==="quiz") return startQuiz(topicSet(d.t,10), {mode:"practice", title:"Quiz: "+TOPICS[d.t].title, key});
  if (d.k==="cards") return go("cards",{key});

function splitCSV(text){

    else if (c==='"') q=true; else if (c===','||c==='\t'){ row.push(f); f=""; }
    else if (c==='\n'||c==='\r'){ if (c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }

}

    if ((tf==="true"||tf==="false") && !wrongs0.length) return [t, text, tf==="true", expl];

function parseQBank(text){

  const reOpt=/^[\[(]?([A-Da-d])[\])\.:]\s*(.+)$/;
  const reAns=/^(?:correct\s+)?answers?\s*(?:is)?\s*[:\-–]?\s*(.+)$/i;
  const reExp=/^(?:explanation|reason|why)\s*[:\-–]\s*(.+)$/i;
  const mark=/\s*(?:✓|✔|\(correct\)|\*)\s*$/i, markL=/^\s*(?:✓|✔|\*)\s*/;

    const km = raw.match(reKey); if (km && qs.some(q=>q.n===+km[1])) { (key[+km[1]]=key[+km[1]]||[]).push(km[2]); return; }
    let m;
    if (cur && (m = raw.match(reAns))) { cur.ans = m[1].trim(); last="ans"; return; }
    if (cur && (m = raw.match(reExp))) { cur.e = m[1].trim(); last="exp"; return; }
    if ((m = raw.match(reQ)) && (!cur || +m[1]===cur.n+1 || +m[1]===1 || cur.opts.length || cur.ans)) { cur={n:+m[1], q:m[2], opts:[], ans:"", e:""}; qs.push(cur); last="q"; }
    else if (cur && (m = raw.match(reOpt))) {
      // several options on one line: "A. x B. y C. z"
      const parts = raw.split(/\s+(?=[\[(]?[B-Db-d][\])\.:]\s)/);
      parts.forEach(pt=>{ const mm=pt.match(reOpt); if (mm) pushOpt(pt, mm[1], mm[2]); });

  qs.forEach(q => {
    const ans = (q.ans || (key[q.n]&&key[q.n].length ? key[q.n].shift() : "") || "").trim();

    if (opts.some(o=>o.ok)) { correct=opts.filter(o=>o.ok).map(o=>o.t); wrong=opts.filter(o=>!o.ok).map(o=>o.t); }
    else if (letters.length && opts.length) { correct=opts.filter(o=>letters.includes(o.l)).map(o=>o.t); wrong=opts.filter(o=>!letters.includes(o.l)).map(o=>o.t); }

  }

  const head = (rows[0]||[]).map(h=>h.toLowerCase());
  const looksCSV = head.some(h=>/^(question|text|correct|answer|type)$/.test(h)) && rows.length>1;
  if (looksCSV) {
    const col = k => head.findIndex(h=>h===k || h.startsWith(k));
    const ci = {type:col("type"), chapter:col("chapter"), topic:col("topic"), text:head.findIndex(h=>/^(text|question|note)/.test(h)), correct:head.findIndex(h=>/^(correct|answer)/.test(h)), expl:col("explan")};
    const wrongCols = head.map((h,i)=>/^(wrong|incorrect|option|distractor)/.test(h)?i:-1).filter(i=>i>=0);
    rows.slice(1).forEach((r,i) => { const g = k => ci[k]>=0 ? (r[ci[k]]||"") : "";

function topicSet(t,n){ const pool = (QBT[t]||[]).slice(); pool.sort((a,b)=>score(a)-score(b)); return shuffle(pool.slice(0, Math.max(n, Math.ceil(pool.length*.6)))).slice(0,n); }
function score(q){ const s=S.qs[q.id]; if(!s) return -1+Math.random()*.5; return (s.c/s.n) + (s.last?0.3:-0.3) + Math.random()*.2; }
function weakSet(n){
  const seen = QS.filter(q=>S.qs[q.id]);
  const pool = seen.length>=n ? seen : QS;
  return shuffle(pool.slice().sort((a,b)=>score(a)-score(b)).slice(0, n*2)).slice(0,n);
}
const MOCKMIX = {c1:2, c2:1, c3:9, c4:7, c5:5};
function mockSet(){
  const out = [];
  Object.entries(MOCKMIX).forEach(([ch,n]) => {
    const pool = QS.filter(q=>TOPICS[q.t].ch===ch);
    const sorted = pool.slice().sort((a,b)=>((S.qs[a.id]?.n||0)-(S.qs[b.id]?.n||0)) + (Math.random()-.5)*1.5);
    out.push(...sorted.slice(0,n));
  });
  return shuffle(out);
}
function startMock(key){ startQuiz(mockSet(), {mode:"mock", title:"Mock exam", key, limit:45*60}); }
function startQuiz(qs, opt){
  session = Object.assign({qs:qs.map(q=>q.id), perm:qs.map(q=>q.tf?[0,1]:shuffle(q.opts.map((_,i)=>i))), ans:qs.map(()=>[]), checked:qs.map(()=>false), flags:qs.map(()=>false), i:0, startedAt:Date.now(), done:false, confirm:false}, opt);
  go("quiz");
}
function curQ(){ return QBY[session.qs[session.i]]; }
function isRight(q, sel){ const c=q.correct; return sel.length===c.length && c.every(x=>sel.includes(x)); }
function remaining(){ return Math.max(0, session.limit - Math.floor((Date.now()-session.startedAt)/1000)); }
function fmtT(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function tick(){ if(!session||session.done||route!=="quiz"){clearInterval(timerId);timerId=null;return;} const r=remaining(); const el=$("#timer"); if(el){el.textContent=fmtT(r); el.classList.toggle("low", r<300);} if(r<=0) finishSession(); }
// ---------- FLASHCARDS ----------
const INTERVALS = [0,1,3,7,14,30,60];
function studiedTopics(){ const plan = buildPlan(), t=todayISO(); const set = new Set(Object.keys(S.read)); plan.filter(d=>d.date<=t).forEach(d=>d.topics.forEach(x=>set.add(x))); return set; }
function dueCards(){ const t=todayISO(); return Object.entries(S.cards).filter(([id,c])=>QBY[id] && c.due<=t).map(([id])=>id); }
function newCards(){
  const st = studiedTopics(); const pool = QS.filter(q=>!S.cards[q.id] && st.has(q.t));
  return pool.sort((a,b)=>ORDER.indexOf(a.t)-ORDER.indexOf(b.t));
}
let deck = null;
function buildDeck(scope){
  const t = todayISO(); if (S.newToday.d!==t) S.newToday={d:t,n:0};
  let ids = dueCards();
  let fresh = scope==="all" ? QS.filter(q=>!S.cards[q.id]) : newCards();
  if (CH[scope]) { ids = ids.filter(id=>TOPICS[QBY[id].t].ch===scope); fresh = QS.filter(q=>!S.cards[q.id] && TOPICS[q.t].ch===scope); }
  const room = Math.max(0, 20 - S.newToday.n);
  const add = scope==="due" ? [] : fresh.slice(0, CH[scope] ? 20 : room).map(q=>q.id);
  return {queue: shuffle(ids).concat(add), flipped:false, seen:0, scope:scope||"plan", key: sub&&sub.key};
}

let swipeMoved = false;
function bindSwipe(){
  const el = document.querySelector(".flip"); if (!el) return;
  let x0=null, y0=0, dx=0;
  el.addEventListener("pointerdown", e => { x0=e.clientX; y0=e.clientY; dx=0; swipeMoved=false; });
  el.addEventListener("pointermove", e => { if (x0==null || !deck.flipped) return; dx = e.clientX-x0; if (Math.abs(dx)>8 && Math.abs(dx)>Math.abs(e.clientY-y0)) { swipeMoved=true; el.classList.add("drag"); el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`; const tnt=$("#tint"); tnt.style.opacity=Math.min(.85,Math.abs(dx)/140); tnt.style.background=dx>0?"var(--good)":"var(--bad)"; tnt.textContent=dx>0?"Got it":"Again"; } });
  const end = () => { if (x0==null) return; x0=null; el.classList.remove("drag");
    if (swipeMoved && Math.abs(dx)>90){ el.style.transition="transform .3s ease"; el.style.transform=`translateX(${dx>0?600:-600}px) rotate(${dx>0?20:-20}deg)`; setTimeout(()=>grade(dx>0?2:0), 220); }
    else { el.style.transform=""; const tnt=$("#tint"); if (tnt) tnt.style.opacity=0; } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
function grade(g){
  const id = deck.queue.shift(); const isNew = !S.cards[id];
  const c = S.cards[id] || {box:0};
  if (g===0){ c.box=0; c.due=todayISO(); deck.queue.splice(Math.min(deck.queue.length,4),0,id); }
  else if (g===1){ c.due=addDays(todayISO(),1); }
  else { c.box=Math.min(6,c.box+1); c.due=addDays(todayISO(),INTERVALS[c.box]); }
  S.cards[id]=c; if (isNew) S.newToday.n++;
  const x = g===2?5:g===1?3:1; gain(x, document.querySelector(".grade") || document.querySelector(".flip"));
  haptic(g===2?"ok":"tap"); if (g===2) sound("ok");
  deck.flipped=false; deck.seen++; markActive(); save(); render();
}

    <div class="row"><button class="btn gold" data-act="mock">Start mock exam</button>${last?`<span class="muted num" style="font-size:.85rem">Last: ${last.score}/24 ${last.score>=18?"✓":""}</span>`:""}</div>
  </section>
  <div class="tiles">
    <button class="tile" data-act="quick" style="--c:#d48a06"><span class="ti">${I.bolt}</span><b>Quick 10</b><span>Answers as you go</span></button>
    <button class="tile" data-act="weak" style="--c:#6b2c91"><span class="ti">${I.target}</span><b>Weak spots</b><span>${w.length?w.map(x=>esc(TOPICS[x.t].title)).slice(0,2).join(", "):"Builds as you practise"}</span></button>
    <button class="tile" data-go="cards" style="--c:#1d6b4c"><span class="ti">${I.cards}</span><b>Flashcards</b><span class="num">${dueCards().length} due</span></button>
  </div>
  <section class="stack"><h3>By topic</h3>
  ${C.chapters.map(ch=>`<div class="stack" style="gap:8px;--c:${ch.color}"><p class="eyebrow" style="color:var(--cc)">Chapter ${ch.n} · ${esc(ch.title)}</p><div class="topic-list">${ch.topics.map(t=>{const s=topicStats(t.id);return `<button class="topic" data-act="topicquiz" data-t="${t.id}"><span class="tt">${esc(t.title)}<small class="num">${s.seen}/${s.total} seen${s.acc!=null?` · ${Math.round(s.acc*100)}% right`:""}</small></span><span class="bar"><i style="width:0;background:${s.acc==null?"var(--line)":s.acc>=.75?"var(--good)":s.acc>=.5?"var(--amber)":"var(--bad)"}" data-w="${s.acc==null?0:Math.round(s.acc*100)}%"></i></span></button>`}).join("")}</div></div>`).join("")}
  </section>`;
}

// PASSPORT (progress, stamps, settings)
// ======================================================================
function mockChart(){
  const m = S.mocks.slice(-12); if (!m.length) return `<p class="empty">No mock exams yet. Your scores will chart here.</p>`;
  const W=330,H=160,L=26,R=10,T=16,B=22;
  const x = i => m.length===1 ? (L+W-R)/2 : L + i*((W-L-R)/(m.length-1));
  const y = v => T + (1-v/24)*(H-T-B);
  const pts = m.map((k,i)=>[x(i), y(Math.round(k.score/k.total*24))]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const area = line + `L${pts[pts.length-1][0]} ${H-B}L${pts[0][0]} ${H-B}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Last ${m.length} mock scores out of 24">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
    ${[0,6,12,18,24].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===18?'stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"':""}/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="${v===18?"var(--good)":"var(--muted)"}" font-weight="${v===18?800:500}">${v}</text>`).join("")}
    ${m.length>1?`<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${pts.map((p,i)=>{ const sc=Math.round(m[i].score/m[i].total*24); return `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${sc>=18?"var(--good)":"var(--bad)"}" stroke="var(--card)" stroke-width="2"/>${i===pts.length-1||m.length<=6?`<text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink)">${sc}</text>`:""}`; }).join("")}
  </svg>`;
}
function vProgress(){
  const r = readiness(), li = levelInfo(xpTotal());
  const answered = Object.keys(S.qs).length;
  const learned = Object.values(S.cards).filter(c=>c.box>=3).length;
  const passes = S.mocks.filter(m=>m.score/m.total>=.75).length;
  const earned = S.badges || {};
  const heat = ORDER.map(t=>{ const s=topicStats(t); const a=s.acc; const col = a==null?null:a>=.75?"var(--good)":a>=.5?"var(--amber)":"var(--bad)"; const bg = a==null?"var(--card)":`color-mix(in srgb, ${col} ${16+Math.round(s.coverage*30)}%, var(--card))`; return `<div style="background:${bg}"><span>${esc(TOPICS[t].title)}</span><b class="num">${a==null?"–":Math.round(a*100)+"%"}</b><span class="muted num" style="font-weight:500">${s.seen}/${s.total} seen</span></div>`; }).join("");
  const nm = (S.prefs.name||"YOU").toUpperCase().replace(/[^A-Z]/g,"").slice(0,12) || "YOU";
  const mrz = `P<GBR${nm}<<SETTLED<<LVL${String(li.L).padStart(2,"0")}<<${String(li.xp).padStart(6,"0")}XP`.padEnd(44,"<").slice(0,44);
  const theme = S.prefs.theme||"auto";
  return `<div class="pagehead"><p class="eyebrow">Saved on this device</p><h1>Your passport</h1></div>
  <section class="cover" style="gap:16px">
    <div class="idpage">
      <div class="photo">${I.user.replace("<svg ","<svg style=\"color:var(--gold-hi)\" ")}<span class="lvl">${li.L}</span></div>
      <div style="min-width:0;display:flex;flex-direction:column;gap:4px">
        <p class="eyebrow">Holder</p><b class="display" style="font-size:1.5rem">${esc(S.prefs.name||"Future citizen")}</b>
        <p class="eyebrow" style="margin-top:6px">Rank</p><b class="display foil" style="font-size:1.35rem">${esc(li.rank)}</b>
      </div>
    </div>
    <div><div class="spread" style="font-size:.82rem;margin-bottom:6px"><span>Level ${li.L}</span><span class="num muted">${li.into.toLocaleString()} / ${li.need.toLocaleString()} XP</span></div><div class="xptrack"><i style="width:0" data-w="${Math.round(li.pct*100)}%"></i></div></div>
    <div class="mrz" aria-hidden="true">${esc(mrz)}<br>${esc(("SETTLED<"+String(Object.keys(earned).length).padStart(2,"0")+"STAMPS<"+todayISO().replace(/-/g,"")).padEnd(44,"<"))}</div>
  </section>
  <section class="card raised"><div class="spread"><h2>Stamps</h2><span class="pill num">${Object.keys(earned).length}/${BADGES.length}</span></div>
    <div class="stamps">${BADGES.map(b=>`<button class="bdg ${earned[b.id]?"":"locked"}" data-badge="${b.id}" aria-label="${esc(b.name)}: ${esc(b.desc)}${earned[b.id]?", earned":", locked"}">${stampSVG(b,!earned[b.id])}<span>${esc(b.name)}</span></button>`).join("")}</div>
    ${sub&&sub.badge?(()=>{ const b=BADGES.find(x=>x.id===sub.badge); return `<div class="card2-box" style="animation:pop .3s var(--spring)"><b>${esc(b.name)}</b> · ${esc(b.desc)}${earned[b.id]?` <span class="muted">(stamped ${fmtDate(earned[b.id],{day:"numeric",month:"short"})})</span>`:""}</div>`; })():""}
  </section>
  <div class="grid3">
    <div class="card stat tight"><b class="num">${r.est==null?"–":Math.round(r.est*24)+"/24"}</b><span>Predicted score</span></div>
    <div class="card stat tight"><b class="num">${passes}/${S.mocks.length}</b><span>Mocks passed</span></div>
    <div class="card stat tight"><b class="num" data-count="${answered}">0</b><span>Questions tried</span></div>
    <div class="card stat tight"><b class="num">${Math.round(r.cov*100)}%</b><span>Bank covered</span></div>
    <div class="card stat tight"><b class="num" data-count="${learned}">0</b><span>Cards learned</span></div>
    <div class="card stat tight"><b class="num">${streak()}</b><span>Day streak</span></div>
  </div>
  <section class="card chart"><div class="spread"><h3>Mock exams</h3><span class="muted" style="font-size:.78rem">dashed line = pass mark</span></div>${mockChart()}</section>
  <section class="card"><h3>Topic mastery</h3><p class="muted" style="font-size:.85rem">Green is 75%+ right, amber 50 to 74%, red below 50%.</p><div class="heat">${heat}</div></section>
  <section class="card"><h3>Settings</h3><div class="opts-list">
    <div class="optrow"><span><b>Your name</b><small>Shown on your passport</small></span><input id="nameBox" value="${esc(S.prefs.name||"")}" placeholder="Optional" maxlength="20" style="width:140px;border:1px solid var(--line2);background:var(--card2);border-radius:11px;padding:8px 10px"></div>
    <div class="optrow"><span><b>Theme</b></span><div class="seg" role="group" aria-label="Theme" style="flex:none">${[["auto","Auto"],["light","Light"],["dark","Dark"]].map(([k,l])=>`<button data-theme="${k}" aria-pressed="${theme===k}">${l}</button>`).join("")}</div></div>
    <div class="optrow"><span><b>Sound effects</b><small>Little chimes for right and wrong</small></span><button class="switch" role="switch" aria-checked="${!!S.prefs.sound}" data-pref="sound" aria-label="Sound effects"></button></div>
    <div class="optrow"><span><b>Haptics</b><small>${HAS_VIBE?"Vibration on answers":"Taps on iPhone and iPad (iOS 18+)"}</small></span><button class="switch" role="switch" aria-checked="${!!S.prefs.haptics}" data-pref="haptics" aria-label="Haptics"></button></div>
    <div class="optrow"><span><b>Your own material</b><small>${EXTRA.sets.length?`${MINE} questions added`:"Upload PDF, CSV or text"}</small></span><button class="btn small" data-act="mine">${I.upload} Manage</button></div>
  </div></section>
  <section class="card"><h3>Move progress to another device</h3><p class="muted" style="font-size:.85rem">Progress lives on this device only. Copy this code and paste it on your other device (phone to iPad, say).</p>
    <div class="row"><button class="btn small" data-act="export">Copy progress code</button></div>
    <textarea id="exportBox" readonly aria-label="Progress code" ${sub&&sub.code?"":"hidden"}>${sub&&sub.code?esc(sub.code):""}</textarea>
    <label for="importBox" style="font-weight:650;font-size:.9rem">Paste a code from another device</label>
    <textarea id="importBox" placeholder="Paste code here"></textarea>
    <div class="row"><button class="btn small" data-act="import">Load progress</button></div></section>
  <section class="card"><h3>Start over</h3>
    ${sub&&sub.reset?`<div class="card confirm"><b>Erase all progress on this device?</b><p>This can't be undone.</p><div class="row"><button class="btn red" data-act="resetok">Erase</button><button class="btn" data-go="progress">Cancel</button></div></div>`:`<button class="btn small" data-act="reset">Reset all progress</button>`}
  </section>
  <p class="muted" style="font-size:.78rem">Notes and questions are original summaries of the official handbook, written for this app. Not affiliated with the Home Office. Test facts checked on gov.uk ${esc(C.meta.verified)}.</p>`;
}
function applyTheme(){ const t = S.prefs.theme||"auto"; if (t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  const dark = t==="dark" || (t==="auto" && matchMedia("(prefers-color-scheme: dark)").matches); const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", dark?"#0a1020":"#14213d"); }

// ======================================================================
// EVENTS
// ======================================================================
document.addEventListener("click", e => {
  if (e.target.closest("[data-flip]")) { if (swipeMoved) { swipeMoved=false; return; } deck.flipped=!deck.flipped; haptic("tap"); return render(); }
  const st = e.target.closest(".station"); if (st) { haptic("tap"); return go("learn",{ch:st.dataset.ch}); }
  const ov = e.target.closest("[data-act='closeov']") || (e.target.dataset && e.target.dataset.backdrop ? e.target : null);
  if (ov) { $("#overlayHost").innerHTML=""; if (ov.dataset.then) go(ov.dataset.then); setTimeout(showPending, 300); return; }
  const b = e.target.closest("button, a"); if (!b) return;
  const d = b.dataset;
  if (d.go){ if (route==="quiz" && session && !session.done){ session.quitAsk=true; render(); return; } haptic("tap"); return go(d.go); }
  if (d.task){ return runTask(JSON.parse(d.task)); }
  if (d.open){ sub = {open: sub&&sub.open===d.open?null:d.open}; haptic("tap"); return render(); }
  if (d.ch && !d.act){ haptic("tap"); return go("learn",{ch:d.ch}); }
  if (d.topic){ haptic("tap"); return go("learn",{topic:d.topic}); }
  if (d.scope){ deck = buildDeck(d.scope); sub=null; haptic("tap"); return render(); }
  if (d.grade){ return grade(+d.grade); }
  if (d.jump){ session.i=+d.jump; session.confirm=false; haptic("tap"); return render(); }
  if (d.badge){ sub = {badge: sub&&sub.badge===d.badge?null:d.badge}; haptic("tap"); return render(); }
  if (d.theme){ S.prefs.theme=d.theme; save(); applyTheme(); haptic("tap"); return render(); }
  if (d.pref){ S.prefs[d.pref]=!S.prefs[d.pref]; save(); if (S.prefs[d.pref]) { if (d.pref==="sound") sound("ok"); if (d.pref==="haptics") haptic("ok"); } return render(); }
  if (d.opt!==undefined && route==="quiz"){
    const s=session, q=curQ(), oi=+d.opt, a=s.ans[s.i], need=q.correct.length;
    if (s.checked[s.i]) return;
    if (a.includes(oi)) a.splice(a.indexOf(oi),1); else { if (need===1) a.length=0; else if (a.length>=need) a.shift(); a.push(oi); }
    haptic("tap");
    return render();
  }
  const act = d.act; if (!act) return;
  const s = session;
  switch(act){
    case "mock": haptic("tap"); return startMock(null);
    case "quick": haptic("tap"); return startQuiz(shuffle(QS).slice(0,10), {mode:"practice", title:"Quick 10"});
    case "weak": haptic("tap"); return startQuiz(weakSet(15), {mode:"practice", title:"Weak spots"});
    case "again": return startQuiz(s.qs.map(id=>QBY[id]), {mode:"practice", title:s.title, key:s.key});
    case "topicquiz": haptic("tap"); return startQuiz(topicSet(d.t,10), {mode:"practice", title:"Quiz: "+TOPICS[d.t].title, key:"quiz:"+d.t});
    case "chquiz": { const pool = QS.filter(q=>TOPICS[q.t].ch===d.ch); return startQuiz(shuffle(pool).slice(0,15), {mode:"practice", title:"Chapter "+CH[d.ch].n+" quiz"}); }
    case "markread":
      if (S.read[d.t]) { delete S.read[d.t]; toast("Marked as unread"); }
      else { S.read[d.t]=Date.now(); markActive(); gain(25, b); haptic("ok"); sound("ok"); toast(pick(["Lovely. Topic read.","Read and noted.","Another one done."])); }
      save(); return render();
    case "facts": return go("learn",{facts:true});
    case "mine": return go("learn",{mine:true});
    case "check": {
      const q=curQ(); s.checked[s.i]=true; const ok = isRight(q,s.ans[s.i]); record(q, ok);
      s.combo = ok ? (s.combo||0)+1 : 0; s.xp = (s.xp||0) + (ok?10:2);
      gain(ok?10:2, b); haptic(ok?"ok":"bad"); sound(ok?"ok":"bad");
      if (ok && s.combo>0 && s.combo%5===0) { setTimeout(()=>confetti(.35),100); }
      save(); render(); const sb=$("#sheetBtn"); if (sb) sb.focus({preventScroll:true}); return; }
    case "next": s.i=Math.min(s.qs.length-1,s.i+1); s.confirm=false; haptic("tap"); render(); return window.scrollTo(0,0);
    case "prev": s.i=Math.max(0,s.i-1); s.confirm=false; return render();
    case "flag": s.flags[s.i]=!s.flags[s.i]; haptic("tap"); return render();
    case "finish": s.confirm=true; return render();
    case "cancelsubmit": s.confirm=false; return render();
    case "submit": return finishSession();
    case "quit": if (s.mode!=="mock" && s.checked.every(c=>!c)) { session=null; return go("home"); } s.quitAsk=true; return render();
    case "quitno": s.quitAsk=false; return render();
    case "quitok": clearInterval(timerId); timerId=null; if (s.mode!=="mock") save(); session=null; return go("home");
    case "flip": deck.flipped=!deck.flipped; haptic("tap"); return render();
    case "restartPlan": S.start=todayISO(); save(); toast("Route restarted from today"); return render();
    case "install": if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(()=>{ deferredInstall=null; render(); }); } return;
    case "hideinstall": S.prefs.hideInstall=true; save(); return render();
    case "export": { const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); sub={code}; render(); const box=$("#exportBox"); box.hidden=false; box.select();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>toast("Copied. Paste it on your other device."),()=>toast("Select the code and copy it")); else toast("Select the code and copy it"); return; }
    case "import": { try { const raw = $("#importBox").value.trim(); const obj = JSON.parse(decodeURIComponent(escape(atob(raw)))); if(!obj||obj.v!==1) throw 0; S=Object.assign(blank(),obj); S.prefs=Object.assign(blank().prefs,S.prefs||{}); save(); deck=null; applyTheme(); toast("Progress loaded"); return go("progress"); } catch(err){ toast("That code didn't work. Copy the whole code and try again."); } return; }
    case "reset": sub={reset:true}; return render();
    case "resetok": { const prefs=S.prefs; S=blank(); S.prefs=prefs; save(); deck=null; session=null; toast("Progress erased"); return go("home"); }
    case "minepaste": { const t=$("#mineText").value; if (!t.trim()) return toast("Paste something first"); return previewMaterial(t, "Pasted "+fmtDate(todayISO(),{day:"numeric",month:"short"})); }
    case "minesave": { const pv=sub.preview; const set={name:pv.name, date:todayISO(), qs:pv.qs, notes:pv.notes}; const x=loadExtra(); x.sets.push(set);
      if (!saveExtra(x)) return toast("Couldn't save: this device is out of space for the app");
      try { sessionStorage.setItem("settled.toast", `Added ${pv.qs.length} question${pv.qs.length===1?"":"s"} and ${pv.notes.length} note${pv.notes.length===1?"":"s"}`); } catch(e){}
      location.hash="learn"; return location.reload(); }
    case "minedel": sub={mine:true, del:+d.i}; return render();
    case "minedelok": { const x=loadExtra(); x.sets.splice(+d.i,1); saveExtra(x); try { sessionStorage.setItem("settled.toast","Removed"); } catch(e){} location.hash="learn"; return location.reload(); }
    case "minetemplate": { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([TEMPLATE],{type:"text/csv"})); a.download="settled-template.csv"; document.body.appendChild(a); a.click(); a.remove(); return toast("Template downloaded"); }
  }
});
document.addEventListener("change", e => {
  if (e.target.id==="mineFile" && e.target.files && e.target.files[0]){ const f=e.target.files[0];
    if (f.size > 3e6 && !/\.pdf$/i.test(f.name)) return toast("That file is too big (3 MB max)");
    if (/\.pdf$/i.test(f.name) || f.type==="application/pdf") {
      if (f.size > 40e6) return toast("That PDF is too big (40 MB max)");
      toast("Reading PDF…");
      pdfText(f).then(t => { if (!t.trim()) return toast("No text found. Scanned PDFs (images) can't be read."); previewMaterial(t, f.name); },
        err => toast(err && err.message==="nolib" ? "PDF reading works in the installed app, not this preview" : "Couldn't read that PDF"));
      return; }
    if (/\.(docx?|xlsx?|pages|numbers)$/i.test(f.name)) return toast("Save it as PDF, CSV or plain text first");
    f.text().then(t=>previewMaterial(t, f.name), ()=>toast("Couldn't read that file")); return; }
  if (e.target.id==="testDate" && e.target.value){ S.testDate=e.target.value; if (S.testDate<=S.start) S.start=todayISO(); save(); toast("Route rebuilt for "+fmtDate(S.testDate)); render(); }
  if (e.target.id==="nameBox"){ S.prefs.name = e.target.value.trim().slice(0,20); save(); render(); }
});
document.addEventListener("keydown", e => {
  if ((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("station")){ e.preventDefault(); return go("learn",{ch:e.target.dataset.ch}); }
  if ((e.key==="Enter"||e.key===" ") && e.target.dataset && e.target.dataset.flip){ e.preventDefault(); deck.flipped=!deck.flipped; render(); const f=document.querySelector("[data-flip]"); if(f) f.focus(); return; }
  if (e.key==="Escape" && $("#overlayHost").innerHTML){ $("#overlayHost").innerHTML=""; return; }
  if (route==="cards" && deck && deck.flipped && !/INPUT|TEXTAREA/.test(e.target.tagName)) { if (e.key==="ArrowRight") return grade(2); if (e.key==="ArrowLeft") return grade(0); }
  if (route!=="quiz" || !session || e.target.tagName==="TEXTAREA" || e.target.tagName==="INPUT") return;
  const k = e.key.toLowerCase(); const map = {a:0,b:1,c:2,d:3,t:0,f:1,"1":0,"2":1,"3":2,"4":3};
  if (k in map){ const pos=map[k]; const oi = session.perm[session.i][pos]; if (oi!==undefined){ const btn=document.querySelector(`[data-opt="${oi}"]`); if(btn&&!btn.disabled) btn.click(); } }
  if (k==="enter"){ const b=document.querySelector('#sheetBtn,[data-act="check"]:not(:disabled),[data-act="next"]'); if(b){ e.preventDefault(); b.click(); } }
});
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener && matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

// ======================================================================
// BOOT
// ======================================================================
(function boot(){
  if (!S.testDate) S.testDate = addDays(todayISO(),27);
  if (diffDays(S.start, S.testDate) < 1) { S.start = todayISO(); }
  document.documentElement.style.setProperty("--guilloche", guilloche());
  applyTheme();
  save();
  const h = location.hash.slice(1);
  route = TABS.some(t=>t[0]===h) ? h : "home";
  let msg = null; try { msg = sessionStorage.getItem("settled.toast"); sessionStorage.removeItem("settled.toast"); } catch(e){}
  if (msg && route==="learn") sub={mine:true};
  render();
  if (msg) toast(msg);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
})();
</script>
